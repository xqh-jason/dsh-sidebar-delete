name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Package contents
        run: npm run pack:check
